# Every push and pull request: install from the lockfile, then lint, type
# check, unit tests and a production build. No secrets and no admin are
# needed: the build compiles without env (instrumentation.js checks env only
# when a server starts), and the tests stub the admin.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
